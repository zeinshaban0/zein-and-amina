<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>زين وأمينة - مساعد دراسة التمريض</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #F8FAFC; }
    .mono-code { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="text-slate-800 pb-28">

  <!-- الترويسة العلوية -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-[#0D3B36] flex items-center justify-center text-white font-bold text-lg shadow-sm">
          ZA
        </div>
        <div>
          <h1 class="text-base font-extrabold text-[#0D3B36] leading-tight">
            زين وأمينة <span class="text-xs font-normal text-[#107C68] font-mono">Zein & Amina</span>
          </h1>
          <p class="text-[11px] text-slate-500 font-medium">مساعدك الذكي في دراسة التمريض</p>
        </div>
      </div>
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 text-[#107C68] text-xs font-bold border border-emerald-200">
        <span class="w-2 h-2 rounded-full bg-[#107C68] animate-pulse"></span>
        جاهز للنقل
      </span>
    </div>
  </header>

  <!-- المحتوى الرئيسي للموبايل -->
  <main class="max-w-md mx-auto px-4 pt-4">

    <!-- شريط معلومات الكارت الحالي -->
    <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm mb-4 flex items-center justify-between">
      <div>
        <span id="sheetBadge" class="text-[10px] font-bold text-[#107C68] bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-100">أوراق A4: 1 - 3</span>
        <h2 id="cardTitle" class="text-sm font-bold text-slate-800 mt-1">تاريخ الحالة والبيانات الأساسية</h2>
      </div>
      <span id="cardNumber" class="text-xs font-black text-slate-400 bg-slate-100 px-2.5 py-1 rounded-lg">1 / 5</span>
    </div>

    <!-- صندوق الكارت التفاعلي -->
    <div id="cardContent" class="space-y-4">
      <!-- محتوى الكروت يتم تبديله تلقائياً -->
    </div>

  </main>

  <!-- شريط التحكم والتنقل السفلي الثابت -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur border-t border-slate-200 px-4 py-3 shadow-lg">
    <div class="max-w-md mx-auto flex items-center justify-between gap-3">
      <button id="prevBtn" onclick="prevCard()" class="flex-1 py-2.5 px-4 rounded-xl border border-slate-300 text-slate-600 font-bold text-xs bg-slate-50 hover:bg-slate-100 disabled:opacity-40">
        ← السابق
      </button>
      <button onclick="copyCurrentCard()" id="mainCopyBtn" class="flex-1 py-2.5 px-4 rounded-xl bg-[#107C68] text-white font-bold text-xs shadow-md hover:bg-[#0D3B36] transition-all flex items-center justify-center gap-1">
        📋 نسخ الكارت
      </button>
      <button id="nextBtn" onclick="nextCard()" class="flex-1 py-2.5 px-4 rounded-xl bg-[#0D3B36] text-white font-bold text-xs shadow-md hover:bg-slate-800">
        التالي →
      </button>
    </div>
  </nav>

  <script>
    const cards = [
      {
        title: "تاريخ الحالة والبيانات الأساسية",
        badge: "أوراق A4: 1 - 3 (Medical History)",
        sections: [
          {
            label: "Chief Complaint (الشكوى الرئيسية)",
            en: "Severe sharp right lower quadrant abdominal pain for 24 hours associated with nausea, low-grade fever, and anorexia.",
            ar: "ألم حاد في الجانب السفلي الأيمن للبطن مستمر منذ 24 ساعة ومصحوب بغثيان، ارتفاع طفيف بالحرارة وفقدان شهية."
          },
          {
            label: "Present Medical History (التاريخ المرضي الحالي)",
            en: "Symptoms started periumbilically then localized to RLQ (McBurney's point). Pain rated 8/10, worsening on movement.",
            ar: "بدأ الألم حول السرة ثم تركز في نقطة ماكبورني بالجانب الأيمن، بشدة 8/10 ويزداد مع الحركة."
          }
        ]
      },
      {
        title: "الفحص البدني للأجهزة الحيوية",
        badge: "أوراق A4: 4 - 8 (Physical Examination)",
        sections: [
          {
            label: "Abdominal Assessment (فحص البطن)",
            en: "Rebound tenderness at McBurney's point, positive Rovsing's sign, localized abdominal guarding, hypoactive bowel sounds.",
            ar: "إيلام ارتدادي إيجابي في نقطة ماكبورني، علامة روفسينغ إيجابية، تحجر موضعي لجدار البطن، وضعف أصوات الأمعاء."
          },
          {
            label: "Vital Signs (العلامات الحيوية)",
            en: "BP: 125/80 mmHg | HR: 104 bpm (Tachycardia) | RR: 20 bpm | Temp: 38.3 °C (Oral).",
            ar: "الضغط: 125/80 | النبض: 104 دقيقة (تسارع) | التنفس: 20 دقيقة | الحرارة: 38.3 مئوية."
          }
        ]
      },
      {
        title: "الفحوصات المعملية والأشعات",
        badge: "أوراق A4: 9 - 11 (Diagnostic Investigations)",
        sections: [
          {
            label: "Laboratory Tests (التحاليل الطبية)",
            en: "CBC: WBC 14,800 /mm3 (Leukocytosis with Left Shift, Neutrophils 84%). CRP: 48 mg/L (Elevated).",
            ar: "صورة الدم: ارتفاع كرات الدم البيضاء لـ 14,800 مع زيادة العدلات. البروتين الالتهابي CRP مرتفع (48)."
          },
          {
            label: "Imaging Studies (الأشعات)",
            en: "Pelvic-Abdominal US: Non-compressible, blind-ended tubular structure measuring 8.2 mm in diameter, periappendiceal fluid noted.",
            ar: "سونار البطن والحوض: ظهور زائدة دودية متضخمة بقطر 8.2 ملم غير قابلة للانضغاط مع تجمع سوائل موضعي."
          }
        ]
      },
      {
        title: "جدول الأدوية والمحاليل",
        badge: "أوراق A4: 12 - 13 (Medications & IV Fluids)",
        sections: [
          {
            label: "IV Antibiotics & Fluids (المحاليل والمضادات)",
            en: "1. Ceftriaxone 1g IV q12h (Broad-spectrum cephalosporin).\n2. Metronidazole 500mg IV infusion q8h.\n3. Ringer's Lactate 1000ml IV at 125 ml/hr.",
            ar: "1. سفترياكسون 1 جم وريدي كل 12 ساعة.\n2. مترونيدازول 500 مجم تسريب وريدي كل 8 ساعات.\n3. محلول رينجر لاكتات 1000 مل بمعدل 125 مل/ساعة تعويضاً للجفاف."
          },
          {
            label: "Analgesia (مسكنات الألم)",
            en: "Ketorolac (Toradol) 30mg IV PRN q8h for acute pain score > 5.",
            ar: "كيتورولاك 30 مجم وريدي عند اللزوم إذا كانت درجة الألم أعلى من 5/10."
          }
        ]
      },
      {
        title: "خطة الرعاية التمريضية الكاملة (NANDA)",
        badge: "أوراق A4: 14 - 17 (Nursing Care Plan)",
        sections: [
          {
            label: "Nursing Diagnosis (التشخيص التمريضي)",
            en: "Acute Pain related to biological injury agents (inflammation and distension of the appendix tissue) as evidenced by verbal report of 8/10 pain, guarding behavior, and tachycardia.",
            ar: "ألم حاد مرتبط بالتهاب وتمدد أنسجة الزائدة مثبت بتقرير المريض (8/10)، التحجر الوقائي، وتسارع ضربات القلب."
          },
          {
            label: "Interventions & Rationales (الإجراءات والأساس العلمي)",
            en: "1. Maintain complete NPO status (Rationale: prepare for emergency surgery and rest the bowel).\n2. Apply ice pack locally, avoid heat (Rationale: heat may cause appendix rupture).\n3. Administer prescribed IV fluids and analgesics.",
            ar: "1. منع الأكل والشرب نهائياً (NPO) تحضيراً للجراحة وإراحة الأمعاء.\n2. استخدام كمادات باردة وتجنب الحرارة تماماً منعاً لانفجار الزائدة.\n3. إعطاء المحاليل والمسكنات الموصوفة وريدياً."
          }
        ]
      }
    ];

    let currentIndex = 0;

    function renderCard() {
      const card = cards[currentIndex];
      document.getElementById('sheetBadge').textContent = card.badge;
      document.getElementById('cardTitle').textContent = card.title;
      document.getElementById('cardNumber').textContent = `${currentIndex + 1} / ${cards.length}`;

      const container = document.getElementById('cardContent');
      container.innerHTML = card.sections.map((sec) => `
        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-bold text-[#0D3B36]">${sec.label}</span>
            <button onclick="copySnippet('${sec.en.replace(/\n/g, ' ')}', this)" class="text-[11px] bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg hover:bg-emerald-100 hover:text-[#107C68] font-bold transition-all">
              نسخ
            </button>
          </div>
          <div class="bg-slate-900 text-emerald-300 p-3 rounded-xl text-xs mono-code leading-relaxed mb-2.5 text-left" dir="ltr">
            ${sec.en.replace(/\n/g, '<br/>')}
          </div>
          <p class="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-xl border border-slate-100 leading-relaxed">
            ${sec.ar.replace(/\n/g, '<br/>')}
          </p>
        </div>
      `).join('');

      document.getElementById('prevBtn').disabled = currentIndex === 0;
      document.getElementById('nextBtn').disabled = currentIndex === cards.length - 1;
    }

    function nextCard() {
      if (currentIndex < cards.length - 1) {
        currentIndex++;
        renderCard();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCard();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function copySnippet(text, btn) {
      navigator.clipboard.writeText(text);
      const original = btn.textContent;
      btn.textContent = '✓ نُسخ';
      btn.classList.add('bg-emerald-600', 'text-white');
      setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove('bg-emerald-600', 'text-white');
      }, 1500);
    }

    function copyCurrentCard() {
      const card = cards[currentIndex];
      const textToCopy = card.sections.map(s => `[${s.label}]\n${s.en}`).join('\n\n');
      navigator.clipboard.writeText(textToCopy);
      const btn = document.getElementById('mainCopyBtn');
      btn.textContent = '✓ تم نسخ الكارت';
      btn.classList.replace('bg-[#107C68]', 'bg-emerald-700');
      setTimeout(() => {
        btn.textContent = '📋 نسخ الكارت';
        btn.classList.replace('bg-emerald-700', 'bg-[#107C68]');
      }, 1500);
    }

    renderCard();
  </script>
</body>
</html>
